name: Deploy site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      reason:
        description: '重建原因'
        required: false
        type: string
        default: 'manual rebuild'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch data branch
        run: git fetch --no-tags origin data

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate data
        run: npm run validate:data
        env:
          DATA_REF: origin/data

      - name: Validate types
        run: npm run lint
        env:
          DATA_REF: origin/data

      - name: Build site from data snapshot
        run: npm run build
        env:
          DATA_REF: origin/data
          # Custom domains are served from /. For project Pages, set the repository variable PAGES_BASE_PATH (for example /PFingan-Website/).
          VITE_BASE_PATH: ${{ vars.PAGES_BASE_PATH || '/' }}
          BUILD_REASON: ${{ inputs.reason || github.event.head_commit.message || 'automatic rebuild' }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
